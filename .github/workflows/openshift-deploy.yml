name: OpenShift Deploy

# Manual deployment workflow for ad-hoc deployments to live OpenShift/ROSA clusters.
# For automated release gating, see e2e-openshift.yml instead.

on:
  workflow_dispatch:
    inputs:
      openshift_server:
        description: 'OpenShift server URL (e.g., https://api.cluster.example.com:6443)'
        required: true
        type: string
      openshift_token:
        description: 'OpenShift authentication token (from: oc whoami -t)'
        required: true
        type: string
      namespace:
        description: 'Target namespace for deployment'
        required: false
        default: 'self-healing-platform'
        type: string
      deploy:
        description: 'Deploy to cluster after testing'
        required: false
        default: false
        type: boolean
      openshift_version:
        description: 'OpenShift version (selects values overlay)'
        required: false
        type: choice
        options:
          - '4.22'
          - '4.21'
          - '4.20'
        default: '4.22'

# Shared concurrency group prevents parallel deploys to the same ROSA cluster
concurrency:
  group: rosa-cluster-e2e
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'

jobs:
  test-and-deploy:
    name: Test and Deploy to OpenShift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          sudo chmod +x /usr/local/bin/oc
          rm -f kubectl README.md openshift-client-linux.tar.gz

      - name: Login to OpenShift cluster
        run: |
          oc login --token="${{ inputs.openshift_token }}" \
            --server="${{ inputs.openshift_server }}" \
            --insecure-skip-tls-verify=true

          echo "Verifying cluster access..."
          oc cluster-info
          oc version

          OCP_VERSION=$(oc get clusterversion version -o jsonpath='{.status.desired.version}' 2>/dev/null || echo "unknown")
          echo "OpenShift version: $OCP_VERSION"

          EXPECTED_VERSION="${{ inputs.openshift_version }}"
          if [[ "$OCP_VERSION" == "$EXPECTED_VERSION"* ]]; then
            echo "OpenShift version matches: $EXPECTED_VERSION"
          else
            echo "Version mismatch: Expected $EXPECTED_VERSION, got $OCP_VERSION"
          fi

      - name: Run tests
        run: |
          echo "Running tests against OpenShift cluster..."
          go test -v -race -coverprofile=coverage.out ./...
        env:
          KUBECONFIG: ${{ runner.home }}/.kube/config

      - name: Install Helm
        if: inputs.deploy == true
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Deploy to OpenShift
        if: inputs.deploy == true
        run: |
          echo "Deploying to OpenShift namespace: ${{ inputs.namespace }}"
          VALUES_FILE="values-ocp-${{ inputs.openshift_version }}.yaml"

          if helm list -n ${{ inputs.namespace }} | grep -q mcp-server; then
            echo "Upgrading existing release..."
            helm upgrade mcp-server ./charts/openshift-cluster-health-mcp \
              --namespace ${{ inputs.namespace }} \
              --values ./charts/openshift-cluster-health-mcp/${VALUES_FILE} \
              --wait
          else
            echo "Installing new release..."
            helm install mcp-server ./charts/openshift-cluster-health-mcp \
              --namespace ${{ inputs.namespace }} \
              --create-namespace \
              --values ./charts/openshift-cluster-health-mcp/${VALUES_FILE} \
              --wait
          fi

      - name: Verify deployment
        if: inputs.deploy == true
        run: |
          echo "Verifying deployment..."
          oc get pods -n ${{ inputs.namespace }}
          oc get svc -n ${{ inputs.namespace }}

          oc wait --for=condition=ready pod \
            -l app.kubernetes.io/name=openshift-cluster-health-mcp \
            -n ${{ inputs.namespace }} \
            --timeout=120s

          POD_NAME=$(oc get pods -n ${{ inputs.namespace }} \
            -l app.kubernetes.io/name=openshift-cluster-health-mcp \
            -o jsonpath='{.items[0].metadata.name}')

          oc port-forward "pod/${POD_NAME}" 18080:8080 -n ${{ inputs.namespace }} &
          PF_PID=$!
          sleep 3

          echo "Testing /health..."
          curl -sf http://localhost:18080/health | jq .

          echo "Testing /mcp/tools..."
          curl -sf http://localhost:18080/mcp/tools | jq 'length'

          echo "Testing /mcp/resources..."
          curl -sf http://localhost:18080/mcp/resources | jq 'length'

          kill $PF_PID 2>/dev/null || true

      - name: Collect logs
        if: always() && inputs.deploy == true
        run: |
          mkdir -p logs
          oc get pods -n ${{ inputs.namespace }} -o yaml > logs/pods.yaml || true
          oc logs -n ${{ inputs.namespace }} \
            -l app.kubernetes.io/name=openshift-cluster-health-mcp \
            --tail=100 > logs/mcp-server.log || true

      - name: Upload logs
        if: always() && inputs.deploy == true
        uses: actions/upload-artifact@v7
        with:
          name: openshift-deploy-logs
          path: logs/
          retention-days: 7

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: openshift-integration
          fail_ci_if_error: false
